name: Frank Core CI

on:
  push:
    branches: [main, ANdroid-Compatibility]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Kotlin 1.9.0
        run: |
          curl -fsSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Run core and prototype tests
        run: ./test.sh

      - name: Run Android compatibility control-plane tests
        run: cargo test --manifest-path platform/android-compat/Cargo.toml

      - name: Run frankd reference daemon
        run: cargo run --manifest-path platform/android-compat/Cargo.toml --bin frankd

      - name: Smoke test interactive Frank learning
        env:
          FRANK_HOME: ${{ runner.temp }}/frank-home
        run: |
          printf 'I was talking about Merkaba today.\nIt is a concept involving geometry and spirituality.\n/memory\n/quit\n' \
            | cargo run --quiet --manifest-path platform/android-compat/Cargo.toml --bin frank \
            | tee "$RUNNER_TEMP/frank-smoke.txt"
          grep -q 'What is Merkaba?' "$RUNNER_TEMP/frank-smoke.txt"
          grep -q 'merkaba --definition-->' "$RUNNER_TEMP/frank-smoke.txt"
