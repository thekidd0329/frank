name: Frank Core CI

on:
  push:
    branches: [main, ANdroid-Compatibility]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Kotlin 1.9.0
        run: |
          curl -fsSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Run core and prototype tests
        run: ./test.sh

      - name: Run Android compatibility control-plane tests
        run: cargo test --manifest-path platform/android-compat/Cargo.toml

      - name: Run frankd reference daemon
        run: cargo run --manifest-path platform/android-compat/Cargo.toml --bin frankd

      - name: Smoke test Kotlin newborn teacher
        run: |
          FIELD="$RUNNER_TEMP/newborn.cog"
          printf '/observe teacher.work music 0.40 +\n/contradict teacher.work music 0.90\n/field\n/restore\n/quit\n' \
            | kotlin -classpath build/frank-bones.jar frank.cli.TeachMain --field "$FIELD" \
            | tee "$RUNNER_TEMP/frank-teacher-smoke.txt"
          grep -q 'opposing pressure teacher.work=music -> NEGATIVE 0.500' "$RUNNER_TEMP/frank-teacher-smoke.txt"
          grep -q 'QUESTION_TARGET' "$RUNNER_TEMP/frank-teacher-smoke.txt"
          grep -q 'restore PASS' "$RUNNER_TEMP/frank-teacher-smoke.txt"
          test -s "$FIELD"
